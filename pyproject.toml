[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stock"
version = "0.1.0"
description = "Chinese stock trading system with sentiment analysis and live trading infrastructure"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core dependencies
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "python-dateutil>=2.8.2",
    "pytz>=2023.3",
    "requests>=2.28.0",
]

[tool.setuptools.packages.find]
include = ["common*", "broker*", "data*", "config*", "backtest*", "sentiment_strategy*", "high_freq_sentiment*"]

[project.optional-dependencies]
# Data collection and storage
data = [
    "akshare>=1.12.0",
    "baostock>=0.8.8",
    "duckdb>=0.9.0",
    "tushare>=1.4.0",
]

# Sentiment arbitrage system (GPU-accelerated)
sentiment = [
    "cupy-cuda12x>=12.0.0",
    "polars>=0.20.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "tritonclient[all]>=2.40.0",
    "scipy>=1.11.0",
    "numba>=0.58.0",
    "aiohttp>=3.8.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "prometheus-client>=0.17.0",
]

# Broker integration for live trading
broker = [
    "futu-api>=6.5.0",
    "python-dotenv>=1.0.0",
]

# Development tools
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "ruff>=0.1.0",
]

# All optional dependencies combined
all = [
    "stock[data,sentiment,broker,dev]",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
