[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stock"
version = "0.1.0"
description = "Chinese stock trading system with sentiment analysis and live trading infrastructure"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core dependencies
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "python-dateutil>=2.8.2",
    "pytz>=2023.3",
    "requests>=2.28.0",
    # Data collection and storage
    "akshare>=1.12.0",
    "baostock>=0.8.8",
    "duckdb>=0.9.0",
    "tushare>=1.4.0",
    # Broker integration for live trading
    "futu-api>=6.5.0",
    "python-dotenv>=1.0.0",
    # Development tools
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "pyright>=1.1.408",
    "markdown>=3.10.2",
]

[tool.setuptools.packages.find]
include = ["common*", "broker*", "data*", "config*", "backtest*", "sentiment_strategy*", "high_freq_sentiment*"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
exclude = [".claude"]

[tool.pytest.ini_options]
testpaths = ["tests", "broker/python", "examples", "sentiment_strategy/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
